name: Selenium Cucumber Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================================================
  # JOB 1 - RUN AUTOMATION TESTS
  # =========================================================
  automation-tests:

    runs-on: windows-latest

    env: 
      MAVEN_OPTS: "-Duser.timezone=Asia/Kolkata"

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 11
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 3. Verify Java and Maven
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Remove old reports
      - name: Clean Old Test Reports
        shell: pwsh
        run: |
          if (Test-Path "test-output") {
            Remove-Item "test-output" -Recurse -Force
          }

      # 5. Run Selenium + Cucumber + TestNG tests
      - name: Run Automation Tests
        run: mvn -Duser.timezone=Asia/Kolkata clean test

      # 6. Prepare Extent Report for GitHub Pages
      - name: Prepare Extent Report
        if: always()
        shell: pwsh
        run: |
          Write-Host "Searching for Spark.html..."

          $report = Get-ChildItem `
            -Path "test-output" `
            -Recurse `
            -Filter "Spark.html" `
            | Select-Object -First 1

          if (-not $report) {
            Write-Error "Spark.html was not found!"
            exit 1
          }

          Write-Host "Extent report found:"
          Write-Host $report.FullName

          # Create directory for GitHub Pages
          New-Item -ItemType Directory -Force -Path "pages-site" | Out-Null

          # Copy the complete SparkReport directory
          Copy-Item `
            -Path ($report.Directory.FullName + "\*") `
            -Destination "pages-site" `
            -Recurse `
            -Force

          # Make Spark.html the homepage
          Copy-Item `
            -Path $report.FullName `
            -Destination "pages-site\index.html" `
            -Force

          Write-Host "Extent report prepared successfully."

      # 7. Configure GitHub Pages
      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      # 8. Upload Pages artifact
      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      # 9. Upload Cucumber HTML Report
      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber.html
          if-no-files-found: warn

      # 10. Upload Extent Report ZIP
      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: test-output/
          if-no-files-found: warn

      # 11. Upload Surefire Reports
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn


  # =========================================================
  # JOB 2 - DEPLOY EXTENT REPORT
  # =========================================================

  deploy-report:

    runs-on: ubuntu-latest

    needs: automation-tests

    # Deploy report even if tests fail
    if: always() && needs.automation-tests.result != 'cancelled'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # Deploy report
      - name: Deploy Extent Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Show clickable report link in GitHub Actions Summary
      - name: 📊 Open Extent Report
        run: |
          echo "## 📊 Extent Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### [🚀 Open Extent Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The report above is the latest Selenium + Cucumber test execution." >> $GITHUB_STEP_SUMMARY
