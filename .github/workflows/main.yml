name: Selenium Cucumber Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  automation-tests:

    runs-on: windows-latest

    steps:

      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Java 11 is required to run the current TestNG dependency
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Verify environment
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # Run Selenium + Cucumber + TestNG tests
      - name: Run Automation Tests
        run: mvn clean test

      # Upload Cucumber HTML report
      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber.html
          if-no-files-found: warn

      # Upload Extent Spark Report
      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: test-output/
          if-no-files-found: warn

      # Upload Maven Surefire/TestNG reports
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
