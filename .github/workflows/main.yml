name: Selenium Cucumber Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  automation-tests:

    runs-on: windows-latest

    steps:

      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 11
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # 3. Verify Java and Maven
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Remove old test reports
      - name: Clean Old Test Reports
        shell: pwsh
        run: |
          if (Test-Path "test-output") {
            Remove-Item "test-output" -Recurse -Force
          }

      # 5. Run Selenium + Cucumber + TestNG tests
      - name: Run Automation Tests
        run: mvn clean test

      # 6. Upload Cucumber HTML Report
      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber.html
          if-no-files-found: warn

      # 7. Upload Extent Report
      - name: Upload Extent Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: test-output/
          if-no-files-found: warn

      # 8. Upload Maven Surefire Reports
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
